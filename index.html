
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">

    <div class="login-card">

      <div class="login-header">
        <h1>Employee Management System</h1>
        <p>Welcome! Please sign in to continue.</p>
      </div>

      <div class="login-section">
        <h2>Employee Login</h2>

        <div class="form-group">
          <label for="employeeId">Employee ID</label>
          <input
            type="text"
            id="employeeId"
            placeholder="Enter Employee ID"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="employeePassword">Password</label>
          <input
            type="password"
            id="employeePassword"
            placeholder="Enter Password"
            autocomplete="current-password"
          >
        </div>

        <button id="employeeLoginButton" class="login-button">
          Employee Login
        </button>
      </div>

      <div class="login-divider">
        <span>OR</span>
      </div>

      <div class="login-section">
        <h2>Manager Login</h2>

        <button id="googleLogin" class="google-button">
          Sign in with Google
        </button>
      </div>

      <div id="loginMessage" class="message"></div>

    </div>
  </section>


  <!-- MAIN APPLICATION -->
  <div id="app" class="app-container hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        <h2>EMS</h2>
        <p>Employee Management</p>
      </div>

      <div class="sidebar-user">
        <div id="userAvatar" class="avatar">U</div>

        <div class="sidebar-user-info">
          <h3 id="sidebarUserName">User</h3>
          <p id="sidebarUserRole">Role</p>
        </div>
      </div>

      <nav class="sidebar-navigation">

        <button
          class="nav-button active"
          data-page="dashboard"
        >
          <span>Dashboard</span>
        </button>

        <button
          class="nav-button manager-only hidden"
          data-page="employees"
        >
          <span>Employee Details</span>
        </button>

        <button
          class="nav-button"
          data-page="leave"
        >
          <span>Leave Management</span>
        </button>

        <button
          class="nav-button manager-only hidden"
          data-page="reports"
        >
          <span>Reports</span>
        </button>

        <button
          class="nav-button"
          data-page="settings"
        >
          <span>Settings</span>
        </button>

      </nav>

      <div class="sidebar-footer">
        <button id="logoutButton" class="logout-button">
          Logout
        </button>
      </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

      <header class="top-header">

        <div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>

        <div class="header-user">

          <div class="header-user-info">
            <span id="headerUserName">User</span>
          </div>

          <div id="headerAvatar" class="avatar">
            U
          </div>

        </div>

      </header>


      <!-- DYNAMIC PAGE CONTENT -->
      <section id="pageContent" class="page-content">
        <p>Loading...</p>
      </section>

    </main>

  </div>


  <!-- FIREBASE APPLICATION -->
  <script type="module" src="app.js"></script>

</body>
</html>
